name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm test

  forgescript:
    name: forgescript ${{ matrix.forgescript }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        forgescript: [1.4.0, 2.0.0, 2.3.0, latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # built against the ForgeScript in package-lock.json, run against the one in the matrix
      - run: npx tsc

      - run: npm i @tryforge/forgescript@${{ matrix.forgescript }} --no-save --no-audit --no-fund

      - run: node --test "dist/__tests__/*.test.js"

  lint:
    name: eslint · prettier
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx eslint ./src

      - run: npx prettier --check "./src/**/*"

  package:
    name: package contents
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: node scripts/checkpack.js
